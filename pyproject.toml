[project]
name = "caiso-forecast"
version = "0.1.0"
description = "Day-ahead CAISO load & price forecaster with a live, graded track record"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gridstatus>=0.30",
    "pandas>=2.2",
    "numpy",
    "pyarrow",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib",
    "requests",
    "holidays",
    "tqdm",
    "truststore",
    "scipy",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caiso_forecast"]
